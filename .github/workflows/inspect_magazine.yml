name: Inspect Magazine Product Fields
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect_magazine.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read sanitized field summary (no keys, prices or names)
        env:
          EASYORDERS_API_KEY: ${{ secrets.EASYORDERS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from collections import Counter
          from urllib.parse import urlparse
          from export_feed import fetch_json, unpack, API
          products=unpack(fetch_json(API+'?join=categories&limit=100&page=1',os.environ['EASYORDERS_API_KEY']))
          print('First page rows',len(products))
          print('hidden',dict(Counter(str(p.get('hidden')) for p in products)))
          print('qty',dict(Counter('<=1' if isinstance(p.get('quantity'),(int,float)) and p['quantity']<=1 else '>1 or missing' for p in products)))
          print('quantity values',dict(Counter(str(p.get('quantity')) for p in products)))
          print('track_stock',dict(Counter(str(p.get('track_stock')) for p in products)))
          print('disable_orders_for_no_stock',dict(Counter(str(p.get('disable_orders_for_no_stock')) for p in products)))
          print('thumb-empty',sum(not p.get('thumb') for p in products))
          print('thumb-scheme-and-host',dict(Counter((urlparse(str(p.get('thumb') or '')).scheme,urlparse(str(p.get('thumb') or '')).hostname) for p in products)))
          print('thumb-first-10-lengths',[len(str(p.get('thumb',''))) for p in products[:10]])
          PY
