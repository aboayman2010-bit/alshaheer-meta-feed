name: Build Weekly Magazine
on:
  workflow_dispatch:
  push:
    paths:
      - 'magazine/**'
      - '.github/workflows/build_magazine.yml'
  schedule:
    - cron: '17 8 * * 5'
permissions:
  contents: read
concurrency:
  group: alshaheer-magazine
  cancel-in-progress: false
jobs:
  magazine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rendering dependencies
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Run magazine safety tests
        run: python -m unittest discover -s magazine/tests -v
      - name: Build 8-page magazine from current Easy Orders prices
        env:
          EASYORDERS_API_KEY: ${{ secrets.EASYORDERS_API_KEY }}
        run: python magazine/build_magazine.py
      - name: Upload images, PDF and ready-to-paste post
        uses: actions/upload-artifact@v4
        with:
          name: alshaheer-magazine
          path: magazine_output/
          if-no-files-found: error
          retention-days: 30
