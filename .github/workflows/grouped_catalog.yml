name: Grouped EasyOrders Catalog Export
on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog_tool/**'
      - '.github/workflows/grouped_catalog.yml'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test hidden product safeguards
        run: python -m unittest discover -s catalog_tool/tests -v
      - name: Export categories and magazine-safe products
        env:
          EASYORDERS_API_KEY: ${{ secrets.EASYORDERS_API_KEY }}
        run: python catalog_tool/export.py
      - name: Save downloadable review files
        uses: actions/upload-artifact@v4
        with:
          name: grouped-catalog-review
          path: catalog_export_output/
          retention-days: 14
          if-no-files-found: error
